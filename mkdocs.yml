site_name: twosample-means
site_description: Auditable analysis for two-sample outcomes and randomized experiments
repo_url: https://github.com/diegoramfin/AB-Test-Pkg
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
nav:
  - Overview: index.md
  - Command line: cli.md
  - Experiment API: experiments.md
  - Designs: designs.md
  - Statistical validation: validation.md
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
