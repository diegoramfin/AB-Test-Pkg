[project]
name = "twosample-means"
version = "0.2.0"
description = "Auditable experiment analysis for binary, continuous, count, and ratio metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Ramirez" }]
keywords = [
    "bayesian",
    "effect-size",
    "hypothesis-testing",
    "statistics",
    "two-sample",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.1.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "pyarrow>=16.0.0,<17.0.0",
    "pymc>=5.16.0,<6.0.0",
    "arviz>=0.18.0,<0.21.0",
    "pingouin>=0.5.4,<0.6.0",
    "matplotlib>=3.9.0,<3.11.0",
]

[project.urls]
Homepage = "https://github.com/diegoramfin/AB-Test-Pkg"
Repository = "https://github.com/diegoramfin/AB-Test-Pkg"
Issues = "https://github.com/diegoramfin/AB-Test-Pkg/issues"

[project.scripts]
twosample-means = "twosample_means.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<0.10.0",
    "mypy>=1.11.0,<2.0.0",
]
kaggle = [
    "kaggle>=1.7.4,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twosample_means"]
include = ["src/twosample_means/schemas/*.json"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
    "pyproject.toml",
    "uv.lock",
]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pingouin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arviz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["twosample_means"]

[tool.coverage.report]
show_missing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
