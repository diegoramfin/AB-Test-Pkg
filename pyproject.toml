[project]
name = "twosample-means"
version = "0.1.0"
description = """\
Exhaustive auditable two-sample mean-difference hypothesis testing \
procedure (non-parametric, Bayesian, frequentist) for experimental \
design, grounded in academic frameworks.\
"""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1.0,<3.0.0",
    "scipy>=1.14.0,<2.0.0",
    "statsmodels>=0.14.2,<0.15.0",
    "pandas>=2.2.2,<3.0.0",
    "pyarrow>=16.0.0,<17.0.0",
    "pymc>=5.16.0,<6.0.0",
    "arviz>=0.18.0,<0.21.0",
    "pingouin>=0.5.4,<0.6.0",
    "matplotlib>=3.9.0,<3.11.0",
    "jupyter>=1.0.0,<2.0.0",
]

[project.scripts]
twosample-means = "twosample_means.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "ruff>=0.6.0,<0.10.0",
    "mypy>=1.11.0,<2.0.0",
    "nbmake>=1.5.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["twosample_means"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["pingouin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pymc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["arviz.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
